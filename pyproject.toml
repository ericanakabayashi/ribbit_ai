[project]
name = "ribbit_ai"
version = "0.1.0"
description = "Ribbit AI 2.0"
authors = [
  { name="Erica Naka", email="ericanaka@berkeley.edu" }
]
requires-python = ">=3.11"

dependencies = [
    # Streamlit Cloud only needs this — keep it lean
    "streamlit",
]

[project.optional-dependencies]
backend = [
    # audio processing
    "librosa",
    "resampy",
    "soundfile",
    "scipy",

    # BirdNET — install the PyPI package OR keep the local clone on sys.path
    "birdnet-analyzer",
    "tensorflow==2.15.1",

    # vector store
    "chromadb",

    # ML / data
    "scikit-learn==1.6.1",
    "numpy",
    "pandas",
    "tqdm",

    # API
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "requests",

    # AWS
    "boto3",

    # misc
    "bcrypt",
    "Pillow",
]
viz = [
    "matplotlib",
    "seaborn",
]
dev = [
    "matplotlib",
    "seaborn",
    "ipykernel",
    "jupyterlab",
]

[tool.uv]
package = false  # application, not a library — skip self-install
